info:
  contact: {}
  description: Backend API for Work Hub — dashboard, DB manager, finances (PEN), and
    couple modules.
  title: Work Hub API
  version: "1.0"
paths:
  /auth/keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.apiKeyView'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - CookieAuth: []
      summary: List API keys
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Requires an active login session (cookie), not another API key
        — you can't mint a key using a key. The "key" field is shown only once and
        cannot be retrieved again.
      parameters:
      - description: Key details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.createAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.apiKeyCreated'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - CookieAuth: []
      summary: Create an API key
      tags:
      - auth
  /auth/keys/{id}:
    delete:
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.revokeAPIKeyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - CookieAuth: []
      summary: Revoke an API key
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Public endpoint. Validates email/password and sets access_token/refresh_token
        cookies.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "401":
          description: invalid email or password
          schema:
            $ref: '#/definitions/httpx.APIError'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessResponse'
      security:
      - CookieAuth: []
      summary: Log out
      tags:
      - auth
  /auth/logout-all:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - CookieAuth: []
      summary: Log out of all sessions
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
      security:
      - CookieAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/refresh:
    post:
      description: Public endpoint (relies on the refresh_token cookie, not JWT auth).
        Atomically claims and rotates the refresh token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/httpx.APIError'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Public endpoint. Registration closes after 2 accounts exist; role
        is server-assigned (first=admin, second=guest).
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.APIError'
        "403":
          description: registration is closed
          schema:
            $ref: '#/definitions/httpx.APIError'
        "409":
          description: email already registered
          schema:
            $ref: '#/definitions/httpx.APIError'
      summary: Register a new user
      tags:
      - auth
  /auth/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.adminUserView'
            type: array
      security:
      - CookieAuth: []
      summary: List users
      tags:
      - auth
  /auth/users/{id}:
    delete:
      parameters:
      - description: User ID
